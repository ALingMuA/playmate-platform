# 生产环境覆盖项（部署到 /opt/gamemate/application-prod.yml）
# 敏感值不在本文件里，由 /opt/gamemate/gameplay.env 通过环境变量注入。
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    com.gameplay: info
    org.springframework: warn
  file:
    name: /opt/gamemate/spring.log

app:
  demo-wallet:
    enabled: false
    allowed-amounts-cents: 1000,5000,10000,50000

# 上传文件落盘目录（由 /api/files/** 受控读取）
file:
  storage:
    dir: /opt/gamemate/uploads
