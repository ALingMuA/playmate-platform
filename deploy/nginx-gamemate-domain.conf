# example.com 域名站点 —— 指向游戏陪玩系统
# 2026-09-16 由原 legacy 站点改造：移除了 /legacy-api/、/legacy-uploads/、/legacy-admin/ 与 legacy 静态前端。
# 注意：该域名未做 ICP 备案，阿里云会拦截其 80/443 公网访问（返回 Non-compliance ICP Filing 页面）。
#       备案通过后本配置无需改动即可直接对外服务。
server {
    listen 80;
    server_name example.com www.example.com;

    # Let's Encrypt 续期校验目录（webroot 方式）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 微信恢复访问验证：直接返回固定文本，保留原有校验文件
    location = /<VERIFY_TOKEN_NAME>.txt {
        default_type text/plain;
        charset utf-8;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        access_log /var/log/nginx/wechat-verify.log wechat_verify_detail;
        return 200 '<VERIFY_TOKEN_VALUE>';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/gamemate/frontend;
    index index.html;
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 客服实时消息：WebSocket 握手需转发 Upgrade 头
    location /ws/cs {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源长期缓存，未命中时直接 404（避免回退到 index.html 导致 JS 执行报错）
    # 注意：Nginx 子块一旦声明 add_header 会覆盖 server 级 add_header，因此安全响应头需在此重复声明
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA 首页禁用强缓存，确保用户随时加载到最新 chunk 索引
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
