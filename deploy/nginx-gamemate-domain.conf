# sknstse.cn 域名站点 —— 指向游戏陪玩系统
# 2026-09-16 由原 skn 站点改造：移除了 /skn-api/、/skn-uploads/、/skn-admin/ 与 skn 静态前端。
# 注意：该域名未做 ICP 备案，阿里云会拦截其 80/443 公网访问（返回 Non-compliance ICP Filing 页面）。
#       备案通过后本配置无需改动即可直接对外服务。
server {
    listen 80;
    server_name sknstse.cn www.sknstse.cn;

    # Let's Encrypt 续期校验目录（webroot 方式）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 微信恢复访问验证：直接返回固定文本，保留原有校验文件
    location = /8e3295281bf6050726c8fcd745d4b8ef.txt {
        default_type text/plain;
        charset utf-8;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        access_log /var/log/nginx/wechat-verify.log wechat_verify_detail;
        return 200 'bf4f327f7eb5797af1ddd17547784c59da5d37a3';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name sknstse.cn www.sknstse.cn;

    ssl_certificate /etc/letsencrypt/live/sknstse.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sknstse.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/gamemate/frontend;
    index index.html;
    client_max_body_size 10m;

    location /uploads/ {
        alias /opt/gamemate/uploads/;
    }

    # 客服实时消息：WebSocket 握手带 JWT，必须转发 Upgrade 头
    location /ws/cs {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
