# 通用配置（可提交）。本机敏感配置见 application-local.yml（已 gitignore）
spring:
  application:
    name: gameplay-backend
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/game_companion_app?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

server:
  port: 8080

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      # 逻辑删除统一字段（user 等表 deleted：0 否，1 是）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（secret 必须至少 256 bit，仅本机文件提供，见 application-local.example.yml）
jwt:
  secret: ${JWT_SECRET:}
  # 令牌有效期（秒），默认 24 小时
  expire-seconds: 86400

# AI 客服：启用后由真实模型生成回答，知识库提供依据和故障兜底。
ai:
  model:
    enabled: ${AI_MODEL_ENABLED:false}
    base-url: ${AI_MODEL_BASE_URL:https://token.sensenova.cn/v1}
    api-key: ${AI_MODEL_API_KEY:${SENSENOVA_API_KEY:}}
    name: ${AI_MODEL_NAME:sensenova-6.8-flash-lite}
    timeout-seconds: ${AI_MODEL_TIMEOUT_SECONDS:25}
    max-output-tokens: ${AI_MODEL_MAX_OUTPUT_TOKENS:2048}
    history-messages: ${AI_MODEL_HISTORY_MESSAGES:12}
  config:
    # 可指定独立的加密主密钥；未指定时从本机 JWT 密钥派生，不输出到管理页面。
    encryption-key: ${AI_CONFIG_ENCRYPTION_KEY:${jwt.secret}}

# 文件存储（概要设计 4.7：本地磁盘实现，可替换为对象存储）
file:
  storage:
    # 存储根目录（相对后端工作目录）
    dir: ${FILE_STORAGE_DIR:./uploads}
    # 单文件大小上限（MB）
    max-size-mb: 5
    # 允许的扩展名（上传校验白名单）
    allowed-extensions: jpg,jpeg,png,gif,webp

logging:
  level:
    com.gameplay: info

# 逗号分隔的前端来源；同源 Nginx 部署时可设置为实际域名
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
