# 答辩演示环境配置：使用环境变量提供敏感信息，避免把凭据写入仓库。
spring:
  config:
    activate:
      on-profile: demo

logging:
  level:
    com.gameplay: info
    org.springframework: warn

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost}
  demo-wallet:
    enabled: true
    allowed-amounts-cents: 1000,5000,10000,50000

file:
  storage:
    dir: ${FILE_STORAGE_DIR:./uploads}
