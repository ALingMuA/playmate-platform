# 集成测试专用配置（可提交）。
# 敏感信息（数据库密码、JWT 密钥）通过 optional import 从本机 application-local.yml 读取；
# 该文件不存在时测试会因缺少 DB 密码/JWT 密钥而失败，属预期行为（本机开发需先配置 application-local.yml）。
spring:
  config:
    import: optional:classpath:application-local.yml

# 测试显式推进任务，避免后台线程读取尚未提交的测试数据。
app:
  ai:
    tasks:
      scheduling-enabled: false

ai:
  model:
    enabled: false
