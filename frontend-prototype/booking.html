  </div>
</header>
<main class="page">
  <div class="container">
    <div class="page-header">
      <h1 class="page-title">创建预约</h1>
      <p class="page-subtitle">预约陪玩师：星野 · 开黑陪伴</p>
    </div>

    <div class="two-col">
      <div>
        <div class="card mb-2">
          <div class="card-body">
            <form onsubmit="event.preventDefault(); location.href='./payment.html';">
              <div class="form-group">
                <label class="form-label">服务项目</label>
                <div class="radio-group">
                  <div class="radio-pill"><input type="radio" name="service" id="s1" checked><label for="s1">开黑陪伴</label></div>
                  <div class="radio-pill"><input type="radio" name="service" id="s2"><label for="s2">游戏教学</label></div>
                  <div class="radio-pill"><input type="radio" name="service" id="s3"><label for="s3">娱乐陪玩</label></div>
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">预约日期</label>
                  <input type="date" class="form-control" value="2026-08-18">
                </div>
                <div class="form-group">
                  <label class="form-label">开始时间</label>
                  <input type="time" class="form-control" value="20:00">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">服务时长</label>
                <input type="range" class="form-control" min="1" max="8" value="2" step="0.5" list="hours" oninput="document.getElementById('durationLabel').textContent = this.value + ' 小时'">
                <datalist id="hours"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></datalist>
                <div class="form-hint" id="durationLabel">2 小时（30 分钟步进）</div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">游戏区服</label>
                  <select class="form-control">
                    <option>微信区</option>
                    <option>QQ 区</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">游戏昵称</label>
                  <input type="text" class="form-control" placeholder="请输入游戏昵称">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">备注需求</label>
                <textarea class="form-control" placeholder="例如：想练射手位，希望多教意识"></textarea>
              </div>

              <button type="submit" class="btn btn-primary btn-lg btn-block">提交订单</button>
            </form>
          </div>
        </div>
      </div>

      <aside>
        <div class="card">
          <div class="card-body">
            <h3 class="card-title">金额明细</h3>
            <div class="mt-2" style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">
              <span>单价</span><span>¥45/小时</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">
              <span>时长</span><span>2 小时</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">
              <span>平台服务费</span><span>¥0</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:14px 0;font-size:1.25rem;font-weight:800;">
              <span>合计</span><span class="text-primary">¥90.00</span>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>
</main>

          游戏陪玩

        <p>专业、安全、有趣的游戏陪玩服务平台，让每一次开黑都充满欢乐。</p>

        <h4>关于我们</h4>
        <a href="./index.html">平台公告</a>

  </div>
