<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 / 注册 - 游戏陪玩系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-visual">
    <h1>欢迎来到<br>游戏陪玩系统</h1>
    <p>专业陪玩、开黑上分、游戏教学，发现更多游戏乐趣。注册即可领取新人大礼包。</p>
  </div>
  <div class="auth-form-wrap">
    <div class="auth-tabs">
      <button class="auth-tab active" data-target="login-panel">登录</button>
      <button class="auth-tab" data-target="register-panel">注册</button>
    </div>

    <div id="login-panel" class="auth-panel active">
      <form onsubmit="event.preventDefault(); location.href='./index.html';">
        <div class="form-group">
          <label class="form-label">用户名 / 手机号</label>
          <input type="text" class="form-control" placeholder="请输入用户名" value="qingfeng">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-control" placeholder="请输入密码" value="password">
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">登录</button>
      </form>
      <p class="mt-2 text-muted" style="text-align:center;">登录即表示同意 <a href="#" style="color:var(--primary);">用户协议</a> 和 <a href="#" style="color:var(--primary);">隐私政策</a></p>
    </div>

    <div id="register-panel" class="auth-panel">
      <form onsubmit="event.preventDefault(); location.href='./index.html';">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" class="form-control" placeholder="设置用户名">
        </div>
        <div class="form-group">
          <label class="form-label">手机号</label>
          <input type="tel" class="form-control" placeholder="请输入手机号">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">密码</label>
            <input type="password" class="form-control" placeholder="设置密码">
          </div>
          <div class="form-group">
            <label class="form-label">确认密码</label>
            <input type="password" class="form-control" placeholder="再次输入密码">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">注册</button>
      </form>
    </div>
  </div>
</div>
<script src="./js/main.js"></script>
</body>
</html>
